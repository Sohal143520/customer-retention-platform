spring.application.name=customer-retention-platform
# Keep routine authentication logs quiet; avoid recording account identifiers at INFO.
logging.level.org.springframework.security=WARN
logging.level.com.retention.platform.customer_retention_platform.service=DEBUG
# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/customer_retention}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
security.jwt.secret=${JWT_SECRET}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

prediction.api.url=${PREDICTION_API_URL:http://127.0.0.1:8000}

# Expose status only for container readiness checks; never return component details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

#ADD upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server
server.port=8080
